name: Connector Checks

# The connector's sync engine decides what to DELETE on a user's machine, and
# its test files were only ever run by hand — one `npx tsx` at a time, which
# is the same as not running them. This gate runs them on every change so a
# broken merge base or a widened link scope is caught here rather than on
# someone's disk.
#
# The installer build lives in release.yml (tag-triggered, together with the
# mobile apps); this job is deliberately cheap — typecheck + tests, no
# electron-builder.

on:
  push:
    paths:
      - 'desktop/**'
      - 'mobile/package.json'
      - 'scripts/version.mjs'
      - '.github/workflows/connector-check.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'mobile/package.json'
      - 'scripts/version.mjs'
      - '.github/workflows/connector-check.yml'
  workflow_dispatch:

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # One product, one version: the desktop app and the mobile app ship in
      # the same release and must agree before anything is built.
      - name: The apps are on one version
        working-directory: .
        run: node scripts/version.mjs --check

      # `npm install`, not `npm ci` — the lockfile is gitignored in this repo
      # (connector-release.yml does the same). The electron binary download is
      # skipped: nothing here launches an app or builds an installer.
      - name: Install
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      # sync-prod-e2e.ts is excluded by the runner: it talks to production.
      - name: Tests
        run: npm test

  # The main window is a React app. The failure a typecheck cannot see is the
  # one that ships: it builds, it installs, and it paints nothing because
  # something threw on mount. So the window is opened, for real, headless.
  smoke:
    name: the main window comes up
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No ELECTRON_SKIP_BINARY_DOWNLOAD here, unlike the job above: this one
      # needs the binary it is about to launch.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Open the window
        run: xvfb-run -a npm run smoke
