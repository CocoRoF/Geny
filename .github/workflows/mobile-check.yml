name: Mobile Check

# The mobile app's pure logic — the connection discipline, the transcript
# fold, the server client — on every change that touches it. These are the
# parts a broken build would not catch: an app that compiles and reconnects
# wrongly looks fine until someone's phone locks mid-turn.

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'desktop/package.json', 'scripts/version.mjs', '.github/workflows/mobile-check.yml']
  pull_request:
    paths: ['mobile/**', 'desktop/package.json', 'scripts/version.mjs', '.github/workflows/mobile-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The desktop app and this one ship in one release at one version.
      # They drifted the moment they had two package.json files, and the
      # symptom was two GitHub releases claiming different versions of the
      # same product.
      - name: The apps are on one version
        run: node scripts/version.mjs --check
      # `npm install`, not `npm ci`, and no npm cache: this repository does
      # not track lockfiles (see .gitignore), which is also why there is
      # nothing for setup-node's cache to key on. Same as the connector jobs.
      - run: npm --prefix mobile install --no-audit --no-fund
      - run: npm --prefix mobile test
      - run: npm --prefix mobile run typecheck
      # The two Android edits prebuild cannot express. Re-running the patch
      # must be a no-op — if it is not, someone regenerated the native project
      # and lost the release signing or the version derivation.
      - name: Android patches are in place
        run: |
          cd mobile
          node scripts/patch-android.mjs
          git diff --exit-code android/app/build.gradle
