name: Mobile Apps

# Builds the Geny mobile app for Android and iOS and publishes them to a
# GitHub Release. Triggered by pushing a `mobile-v*` tag, or manually.
#
# The native projects (mobile/android, mobile/ios) are `expo prebuild` output
# committed to the repository, so CI builds exactly what a developer built —
# regenerating them here would make the release depend on whatever the Expo
# template looked like that morning.
#
# Android ships a real, installable APK. iOS ships an UNSIGNED .ipa: Apple
# distribution needs a developer certificate and provisioning profile, which
# are not in this repository. The unsigned build still proves the iOS side
# compiles, and is the input to a signing step for anyone who has an Apple
# Developer account (or to a sideloading tool).

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Reuse the Gradle distribution, dependencies and build cache between
      # runs — a cold Android build is mostly downloading.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - run: npm --prefix mobile ci --no-audit --no-fund

      - name: Tests + types
        run: |
          npm --prefix mobile test
          npm --prefix mobile run typecheck

      # ⚠ Every release must be signed with the SAME key, or Android refuses
      # to install it over the previous version ("package conflicts with an
      # existing package") and the user has to uninstall first — losing their
      # server address, their token and their session. The key lives in
      # repository secrets; this repo is public, so it cannot be committed.
      # Without the secret (a fork, a manual run before setup) we fall back to
      # a throwaway key and say so loudly.
      - name: Prepare the signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/geny.keystore
            echo "Using the fixed release key — installs as an update."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set; signing with a throwaway key. This APK cannot update an existing install."
            keytool -genkeypair -v -keystore /tmp/geny.keystore -alias geny \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass geny-release -keypass geny-release \
              -dname "CN=Geny, O=Geny"
          fi

      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_FILE: /tmp/geny.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'geny-release' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'geny' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'geny-release' }}

      # The fingerprint in the log is how a future release proves it was
      # signed with the same key as this one.
      - name: Verify the signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            mobile/android/app/build/outputs/apk/release/app-release.apk | head -3

      - name: Name it
        run: |
          VER=$(node -p "require('./mobile/package.json').version")
          mkdir -p dist-mobile
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist-mobile/Geny-$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-mobile/*.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    # macos-latest ships an Xcode whose clang rejects the fmt version React
    # Native 0.79 vendors. Pin to the image that still carries Xcode 16.
    runs-on: macos-15
    # Apple's toolchain moves under us regularly, and an iOS build that broke
    # overnight should not hold back the Android release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Select Xcode 16
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version

      - run: npm --prefix mobile ci --no-audit --no-fund

      - uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('mobile/package-lock.json', 'mobile/ios/Podfile') }}
          restore-keys: ios-pods-

      - name: Pod install
        working-directory: mobile/ios
        run: pod install

      - name: Build (no signing)
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace Geny.xcworkspace -scheme Geny \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package an unsigned IPA
        run: |
          VER=$(node -p "require('./mobile/package.json').version")
          APP=$(find mobile/ios/build/Build/Products -name "*.app" -maxdepth 3 | head -1)
          [ -n "$APP" ] || { echo "no .app was produced"; exit 1; }
          mkdir -p /tmp/Payload dist-ios
          cp -R "$APP" /tmp/Payload/
          (cd /tmp && zip -qry "$OLDPWD/dist-ios/Geny-$VER-ios-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist-ios/*.ipa
          if-no-files-found: error

  release:
    name: Publish
    needs: [android, ios]
    # `ios` may have failed (continue-on-error); publish whatever exists.
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.ipa' \) -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          body: |
            ## Geny Mobile

            서버의 에이전트와 대화하는 Android / iOS 앱입니다. 채팅과 설정만 있고
            아바타는 없습니다 — 그쪽은 데스크톱 접속기의 몫입니다.

            화면을 꺼도 턴은 서버에서 계속 돌아갑니다. 앱이 돌아오면 그 턴에 다시
            붙어서 처음부터 다시 받아옵니다.

            ### 설치

            - **Android**: `Geny-*.apk` 를 받아 실행하세요 (출처를 알 수 없는 앱 허용 필요).
            - **iOS**: `*-ios-unsigned.ipa` 는 **서명되지 않았습니다.** Apple 배포
              서명에는 개발자 계정이 필요합니다 — 직접 서명하거나 사이드로딩
              도구로 설치하세요.

            첫 실행에서 서버 주소와 관리자 계정을 넣으면 됩니다.
