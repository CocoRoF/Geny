[project]
name = "geny"
version = "1.0.3"
description = "Geny (Geny Execute, Not You) - Autonomous Multi-Agent System"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    # numpy stays for non-memory uses (image / waveform processing,
    # statistics in the affect summary path). FAISS removed in
    # Phase 2 — vector search is now the executor MemoryProvider's
    # composite.vector() handle (file backend ships pure-Python).
    "numpy>=1.26.0",
    # File pattern matching
    "pathspec>=0.12.0",
    # PostgreSQL database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    # Web search
    "ddgs==9.11.4",
    # Web fetch & browser automation
    # WebSocket protocol
    "websockets>=13.0",
    # geny-executor 2.2.0 — the "Environment is the single source of
    # truth" release. Strategy configure() trio (fixes the prod bug
    # where evaluation_chain/multi_dim_budget strategy_configs were
    # silently dropped, terminating the worker loop after one
    # iteration), build_manifest()/validate_manifest(), Pipeline
    # session lifecycle (aclose/refresh_runtime/ModelOverrides/
    # begin_turn), typed EventTypes catalogue + pipeline.events() tap,
    # full streaming chunk forwarding (thinking.delta / api.tool_use /
    # api.tool_result), manifest-expressible subagents+memory,
    # CLI auth_mode + golden wire fixtures, OpenAI streamed-usage fix,
    # embedding credential bundle channel + 401 circuit breaker.
    # Geny compat verified zero-regression (byte-identical failure
    # list vs 2.1.4). Migration guide: executor docs/migration-2.2.md.
    # 2.5.0 — token-budget guard compacts-and-rechecks (projected
    # next-request measure + Stage 2/4 shared estimator) instead of
    # hard-failing; PersistingLLMSummaryCompactor auto-wired into the
    # guard recovery path.
    # 2.9.0 — first-class local LLM providers (ollama / lmstudio /
    # custom) via declarative ProviderProfile + /api/show context-window
    # probe + tolerant local tool-call JSON repair. Geny surfaces these
    # in the LLM Backends panel.
    # 2.10.0 — built-in output-channel transports (webhook / telegram /
    # discord / slack / ntfy) so Geny declares channels in config and the
    # executor builds them (no host transport code). Keep in sync with
    # requirements.txt.
    "geny-executor[qdrant,ssh]>=2.68.1,<3.0.0",
    "geny-memory-adaptor>=1.6.0",
    "contextifier[pdf]>=0.5.0",
    # Knowledge connectors — cron schedules + DB sources (postgres/mysql/sqlite)
    "croniter>=2.0.0",
    "sqlalchemy>=2.0.0",
    # >=0.15.x adds arrange_doc; still caps mcp<2.0 transitively.
    "edit2docs>=0.16.1",
    "an-web>=0.9.1",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0,<3",
    # Auth
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
